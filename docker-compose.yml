version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: facturacion_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: plataforma_facturacion
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - facturacion_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO Object Storage (S3 Compatible)
  minio:
    image: minio/minio:latest
    container_name: facturacion_minio
    restart: unless-stopped
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    volumes:
      - minio_data:/data
    networks:
      - facturacion_network
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # MinIO Client - Create bucket on startup
  minio-init:
    image: minio/mc:latest
    container_name: facturacion_minio_init
    depends_on:
      - minio
    networks:
      - facturacion_network
    entrypoint: >
      /bin/sh -c "
      sleep 10;
      /usr/bin/mc alias set myminio http://minio:9000 minio minio123;
      /usr/bin/mc mb myminio/facturacion --ignore-existing;
      /usr/bin/mc anonymous set download myminio/facturacion;
      exit 0;
      "

  # Python OCR Service
  ocr_service:
    build:
      context: ./backend/python_ocr
      dockerfile: Dockerfile
    container_name: facturacion_ocr
    restart: unless-stopped
    volumes:
      - ./backend/storage/app/public:/app/storage:ro  # Solo lectura de archivos
    networks:
      - facturacion_network
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import pytesseract; print('OK')"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  facturacion_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
